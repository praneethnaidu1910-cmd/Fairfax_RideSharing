[alembic]
script_location = migrations

# sqlalchemy.url is deliberately absent -- migrations/env.py reads
# DATABASE_URL from the environment instead (TASKS.md #9: "DATABASE_URL
# comes from the environment, never hardcoded").

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
